<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Hackathon Timer</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0a0a0f;
      --surface: #11111a;
      --border:  #1e1e2e;
      --accent:  #7c3aed;
      --accent2: #a855f7;
      --text:    #f0f0f8;
      --muted:   #6b7280;
      --danger:  #ef4444;
      --success: #22c55e;
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(124,58,237,.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(124,58,237,.05) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
    }

    .card {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 1.2rem;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 48px rgba(0,0,0,.5);
      animation: fadeUp .5s ease forwards;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: .3rem;
    }
    .subtitle {
      font-size: .85rem;
      color: var(--muted);
      margin-bottom: 2rem;
    }

    /* ── Form elements ─────────────────────────────────────────────────── */
    label {
      display: block;
      font-size: .82rem;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: .4rem;
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="number"] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: .6rem;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      padding: .7rem 1rem;
      outline: none;
      transition: border-color .2s;
      margin-bottom: 1.2rem;
    }
    input:focus { border-color: var(--accent); }

    .row {
      display: flex;
      gap: .8rem;
    }
    .row > div { flex: 1; }

    /* suffix label inside input row */
    .field-suffix {
      display: flex;
      align-items: center;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: .6rem;
      overflow: hidden;
      margin-bottom: 1.2rem;
    }
    .field-suffix input {
      border: none;
      margin: 0;
      border-radius: 0;
      background: transparent;
    }
    .field-suffix span {
      padding: 0 .8rem;
      color: var(--muted);
      font-size: .85rem;
      white-space: nowrap;
    }

    /* ── Buttons ───────────────────────────────────────────────────────── */
    .btn {
      display: block;
      width: 100%;
      padding: .8rem;
      border: none;
      border-radius: .6rem;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s, opacity .15s;
    }
    .btn:hover  { transform: scale(1.02); }
    .btn:active { transform: scale(.98); }
    .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      box-shadow: 0 0 24px rgba(124,58,237,.4);
    }
    .btn-primary:hover { box-shadow: 0 0 36px rgba(168,85,247,.6); }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      margin-top: .6rem;
    }
    .btn-ghost:hover { border-color: var(--accent); color: var(--text); }

    /* ── Messages ──────────────────────────────────────────────────────── */
    .msg {
      font-size: .88rem;
      border-radius: .5rem;
      padding: .6rem .9rem;
      margin-bottom: 1rem;
      display: none;
    }
    .msg.error   { background: rgba(239,68,68,.12); color: #fca5a5; border: 1px solid rgba(239,68,68,.3); }
    .msg.success { background: rgba(34,197,94,.12); color: #86efac; border: 1px solid rgba(34,197,94,.3); }
    .msg.info    { background: rgba(124,58,237,.12); color: #c4b5fd; border: 1px solid rgba(124,58,237,.3); }

    /* ── Divider ───────────────────────────────────────────────────────── */
    hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 1.5rem 0;
    }

    /* ── Status badge ──────────────────────────────────────────────────── */
    .status-row {
      display: flex;
      align-items: center;
      gap: .5rem;
      font-size: .85rem;
      color: var(--muted);
      margin-bottom: 1.4rem;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }
    .dot.running { background: var(--success); box-shadow: 0 0 8px var(--success); animation: pulse 2s infinite; }
    .dot.ended   { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
    .dot.idle    { background: var(--muted); }

    @keyframes pulse {
      0%   { opacity: 1; }
      50%  { opacity: 0.4; }
      100% { opacity: 1; }
    }

    .btn-row {
      display: flex;
      gap: .8rem;
      margin-top: .8rem;
    }
    .btn-reset {
      background: rgba(239, 68, 68, .12);
      border: 1px solid rgba(239, 68, 68, .35);
      color: #fca5a5;
    }
    .btn-reset:hover {
      background: rgba(239, 68, 68, .25);
      border-color: var(--danger);
      color: #fff;
    }
    .btn-launch {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      box-shadow: 0 0 20px rgba(16, 185, 129, .4);
      margin-top: .6rem;
    }
    .btn-launch:hover {
      box-shadow: 0 0 30px rgba(16, 185, 129, .6);
    }
  </style>
</head>
<body>

<div class="card">
  <!-- ── Login panel ──────────────────────────────────────────────── -->
  <div id="login-panel">
    <h1>Admin Login</h1>
    <p class="subtitle">Hackathon Timer — Admin</p>

    <div id="login-err" class="msg error"></div>

    <label for="email">Email</label>
    <input type="email" id="email" value="yuvarajkhot2005@gmail.com" placeholder="yuvarajkhot2005@gmail.com" autocomplete="username" />

    <label for="password">Password</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />

    <button class="btn btn-primary" id="login-btn" onclick="doLogin()">Log In</button>
  </div>

  <!-- ── Settings panel ──────────────────────────────────────────── -->
  <div id="settings-panel" style="display:none">
    <h1>Timer Settings</h1>
    <p class="subtitle">Configure and start your hackathon</p>

    <div class="status-row">
      <div class="dot idle" id="status-dot"></div>
      <span id="status-text">Loading…</span>
    </div>

    <div id="settings-err"  class="msg error"></div>
    <div id="settings-ok"   class="msg success"></div>
    <div id="settings-info" class="msg info"></div>

    <label for="hack-name">Hackathon Name</label>
    <input type="text" id="hack-name" placeholder="e.g. ACM Hackathon 2026" maxlength="80" />

    <label>Duration</label>
    <div class="row">
      <div>
        <div class="field-suffix">
          <input type="number" id="hours" min="0" max="99" value="0" />
          <span>hrs</span>
        </div>
      </div>
      <div>
        <div class="field-suffix">
          <input type="number" id="minutes" min="0" max="59" value="30" />
          <span>min</span>
        </div>
      </div>
    </div>

    <button class="btn btn-primary" id="save-btn" onclick="doSave()">Save Settings</button>
    <button class="btn btn-launch"  id="start-btn-admin" onclick="doStart()">Launch Timer Now ⚡</button>
    <div class="btn-row">
      <button class="btn btn-reset" id="reset-btn" onclick="doReset()">Reset Timer</button>
    </div>
    <button class="btn btn-ghost"   id="logout-btn" onclick="doLogout()">Log Out</button>
  </div>
</div>

<script>
  // ── Helpers ──────────────────────────────────────────────────────────────
  function show(el, type, text) {
    el.className = 'msg ' + type;
    el.textContent = text;
    el.style.display = 'block';
  }
  function hide(el) { el.style.display = 'none'; }

  // ── Login ────────────────────────────────────────────────────────────────
  async function doLogin() {
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();
    const errEl    = document.getElementById('login-err');
    const btn      = document.getElementById('login-btn');

    hide(errEl);

    if (!email || !password) {
      show(errEl, 'error', 'Please enter your password.');
      return;
    }

    btn.disabled = true;

    try {
      const res  = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const body = await res.json();
      if (res.ok) {
        showSettings();
      } else {
        show(errEl, 'error', body.error || 'Invalid credentials.');
        btn.disabled = false;
      }
    } catch {
      show(errEl, 'error', 'Server unreachable.');
      btn.disabled = false;
    }
  }

  // Enter key triggers login
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && document.getElementById('login-panel').style.display !== 'none') {
      doLogin();
    }
  });

  let currentState = null;
  let tickTimer    = null;
  let pollTimer    = null;

  function pad(n) { return String(n).padStart(2, '0'); }

  function msToHMS(ms) {
    const t = Math.max(0, Math.floor(ms / 1000));
    return pad(Math.floor(t / 3600)) + ':' + pad(Math.floor((t % 3600) / 60)) + ':' + pad(t % 60);
  }

  // ── Show settings panel & load current state ──────────────────────────────
  async function showSettings() {
    document.getElementById('login-panel').style.display    = 'none';
    document.getElementById('settings-panel').style.display = 'block';
    await loadState();

    if (!tickTimer) tickTimer = setInterval(renderStatus, 1000);
    if (!pollTimer) pollTimer = setInterval(loadState, 4000);
  }

  async function loadState() {
    try {
      const res   = await fetch('/api/state');
      const state = await res.json();
      applyState(state);
    } catch {
      show(document.getElementById('settings-err'), 'error', 'Could not load state.');
    }
  }

  function renderStatus() {
    if (!currentState) return;
    const dot      = document.getElementById('status-dot');
    const statusTx = document.getElementById('status-text');
    const saveBtn  = document.getElementById('save-btn');
    const startBtn = document.getElementById('start-btn-admin');
    const infoEl   = document.getElementById('settings-info');
    const resetBtn = document.getElementById('reset-btn');
    const hoursEl  = document.getElementById('hours');
    const minEl    = document.getElementById('minutes');
    const nameEl   = document.getElementById('hack-name');

    const now = Date.now();
    const isRunning = !!(currentState.started && currentState.endTime && now < currentState.endTime);
    const isEnded   = !!(currentState.started && currentState.endTime && now >= currentState.endTime);

    if (isRunning) {
      const rem = Math.max(0, currentState.endTime - now);
      dot.className = 'dot running';
      statusTx.textContent = 'Timer is RUNNING (' + msToHMS(rem) + ' remaining)';
      saveBtn.disabled = true;
      if (startBtn) {
        startBtn.disabled = true;
        startBtn.textContent = 'Timer Running ⏱';
      }
      hoursEl.disabled = true;
      minEl.disabled = true;
      nameEl.disabled = true;
      resetBtn.disabled = false;
      show(infoEl, 'info', 'Timer is currently running (' + msToHMS(rem) + ' left). Click "Reset Timer" if you need to stop or change duration.');
    } else if (isEnded) {
      dot.className = 'dot ended';
      statusTx.textContent = "TIME'S UP! (Completed)";
      saveBtn.disabled = false;
      if (startBtn) {
        startBtn.disabled = false;
        startBtn.textContent = 'Launch Timer Now ⚡';
      }
      hoursEl.disabled = false;
      minEl.disabled = false;
      nameEl.disabled = false;
      resetBtn.disabled = false;
      show(infoEl, 'info', "Countdown has ended (Time's Up). You can edit duration or name and click 'Launch Timer Now ⚡' or 'Save Settings'.");
    } else {
      dot.className = 'dot idle';
      statusTx.textContent = 'Timer not started';
      saveBtn.disabled = false;
      if (startBtn) {
        startBtn.disabled = false;
        startBtn.textContent = 'Launch Timer Now ⚡';
      }
      hoursEl.disabled = false;
      minEl.disabled = false;
      nameEl.disabled = false;
      resetBtn.disabled = true;
      hide(infoEl);
    }
  }

  function applyState(state) {
    currentState = state;

    const nameInput    = document.getElementById('hack-name');
    const hoursInput   = document.getElementById('hours');
    const minutesInput = document.getElementById('minutes');

    if (document.activeElement !== nameInput) {
      nameInput.value = state.name || '';
    }

    if (state.durationMs && document.activeElement !== hoursInput && document.activeElement !== minutesInput) {
      const totalMin = Math.floor(state.durationMs / 60000);
      hoursInput.value   = Math.floor(totalMin / 60);
      minutesInput.value = totalMin % 60;
    }

    renderStatus();
  }

  // ── Save ─────────────────────────────────────────────────────────────────
  async function doSave() {
    const errEl   = document.getElementById('settings-err');
    const okEl    = document.getElementById('settings-ok');
    const saveBtn = document.getElementById('save-btn');

    hide(errEl); hide(okEl);
    saveBtn.disabled = true;

    const body = {
      name:    document.getElementById('hack-name').value.trim(),
      hours:   document.getElementById('hours').value,
      minutes: document.getElementById('minutes').value,
    };

    try {
      const res  = await fetch('/api/settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if (res.status === 401) {
        alert('Session expired. Please log in again.');
        doLogout();
        return;
      }
      const data = await res.json();
      if (res.ok) {
        show(okEl, 'success', 'Settings saved! Timer is ready to launch.');
        applyState(data.data);
      } else {
        show(errEl, 'error', data.error || 'Save failed.');
        saveBtn.disabled = false;
      }
    } catch {
      show(errEl, 'error', 'Server unreachable.');
      saveBtn.disabled = false;
    }
  }

  // ── Launch Timer ─────────────────────────────────────────────────────────
  async function doStart() {
    const errEl    = document.getElementById('settings-err');
    const okEl     = document.getElementById('settings-ok');
    const startBtn = document.getElementById('start-btn-admin');
    hide(errEl); hide(okEl);

    const body = {
      name:    document.getElementById('hack-name').value.trim(),
      hours:   document.getElementById('hours').value,
      minutes: document.getElementById('minutes').value,
    };

    if (startBtn) startBtn.disabled = true;

    try {
      // Save settings first to ensure entered duration is active
      const saveRes = await fetch('/api/settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if (saveRes.status === 401) {
        alert('Session expired. Please log in again.');
        doLogout();
        return;
      }
      if (!saveRes.ok) {
        const saveErr = await saveRes.json();
        show(errEl, 'error', saveErr.error || 'Could not save settings.');
        if (startBtn) startBtn.disabled = false;
        return;
      }

      // Start the timer
      const startRes = await fetch('/api/start', { method: 'POST' });
      const data = await startRes.json();
      if (startRes.ok) {
        show(okEl, 'success', 'Timer started and running!');
        applyState(data.data);
      } else {
        show(errEl, 'error', data.error || 'Could not start timer.');
        if (startBtn) startBtn.disabled = false;
      }
    } catch {
      show(errEl, 'error', 'Server unreachable.');
      if (startBtn) startBtn.disabled = false;
    }
  }

  // ── Reset ────────────────────────────────────────────────────────────────
  async function doReset() {
    const now = Date.now();
    const isRunning = currentState && currentState.started && currentState.endTime && now < currentState.endTime;
    if (isRunning && !confirm('The timer is currently running. Are you sure you want to stop and reset it?')) {
      return;
    }

    const errEl    = document.getElementById('settings-err');
    const okEl     = document.getElementById('settings-ok');
    const resetBtn = document.getElementById('reset-btn');

    hide(errEl); hide(okEl);
    resetBtn.disabled = true;

    try {
      const res  = await fetch('/api/reset', { method: 'POST' });
      if (res.status === 401) {
        alert('Session expired. Please log in again.');
        doLogout();
        return;
      }
      const data = await res.json();
      if (res.ok) {
        show(okEl, 'success', 'Timer reset successfully!');
        applyState(data.data);
      } else {
        show(errEl, 'error', data.error || 'Reset failed.');
        resetBtn.disabled = false;
      }
    } catch {
      show(errEl, 'error', 'Server unreachable.');
      resetBtn.disabled = false;
    }
  }

  // ── Logout ───────────────────────────────────────────────────────────────
  async function doLogout() {
    if (tickTimer) { clearInterval(tickTimer); tickTimer = null; }
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    await fetch('/api/logout', { method: 'POST' });
    document.getElementById('settings-panel').style.display = 'none';
    document.getElementById('login-panel').style.display    = 'block';
    document.getElementById('login-btn').disabled = false;
    document.getElementById('password').value = '';
  }

  // ── Auto-check session on page load ──────────────────────────────────────
  (async () => {
    try {
      const res  = await fetch('/api/auth-check');
      const data = await res.json();
      if (data.authenticated) showSettings();
    } catch { /* not logged in */ }
  })();
</script>
</body>
</html>
