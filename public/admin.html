<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Hackathon Timer</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0a0a0f;
      --surface: #11111a;
      --border:  #1e1e2e;
      --accent:  #7c3aed;
      --accent2: #a855f7;
      --text:    #f0f0f8;
      --muted:   #6b7280;
      --danger:  #ef4444;
      --success: #22c55e;
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(124,58,237,.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(124,58,237,.05) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
    }

    .card {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 1.2rem;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 48px rgba(0,0,0,.5);
      animation: fadeUp .5s ease forwards;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: .3rem;
    }
    .subtitle {
      font-size: .85rem;
      color: var(--muted);
      margin-bottom: 2rem;
    }

    /* ── Form elements ─────────────────────────────────────────────────── */
    label {
      display: block;
      font-size: .82rem;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: .4rem;
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="number"] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: .6rem;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      padding: .7rem 1rem;
      outline: none;
      transition: border-color .2s;
      margin-bottom: 1.2rem;
    }
    input:focus { border-color: var(--accent); }

    .row {
      display: flex;
      gap: .8rem;
    }
    .row > div { flex: 1; }

    /* suffix label inside input row */
    .field-suffix {
      display: flex;
      align-items: center;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: .6rem;
      overflow: hidden;
      margin-bottom: 1.2rem;
    }
    .field-suffix input {
      border: none;
      margin: 0;
      border-radius: 0;
      background: transparent;
    }
    .field-suffix span {
      padding: 0 .8rem;
      color: var(--muted);
      font-size: .85rem;
      white-space: nowrap;
    }

    /* ── Buttons ───────────────────────────────────────────────────────── */
    .btn {
      display: block;
      width: 100%;
      padding: .8rem;
      border: none;
      border-radius: .6rem;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s, opacity .15s;
    }
    .btn:hover  { transform: scale(1.02); }
    .btn:active { transform: scale(.98); }
    .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      box-shadow: 0 0 24px rgba(124,58,237,.4);
    }
    .btn-primary:hover { box-shadow: 0 0 36px rgba(168,85,247,.6); }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      margin-top: .6rem;
    }
    .btn-ghost:hover { border-color: var(--accent); color: var(--text); }

    /* ── Messages ──────────────────────────────────────────────────────── */
    .msg {
      font-size: .88rem;
      border-radius: .5rem;
      padding: .6rem .9rem;
      margin-bottom: 1rem;
      display: none;
    }
    .msg.error   { background: rgba(239,68,68,.12); color: #fca5a5; border: 1px solid rgba(239,68,68,.3); }
    .msg.success { background: rgba(34,197,94,.12); color: #86efac; border: 1px solid rgba(34,197,94,.3); }
    .msg.info    { background: rgba(124,58,237,.12); color: #c4b5fd; border: 1px solid rgba(124,58,237,.3); }

    /* ── Divider ───────────────────────────────────────────────────────── */
    hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 1.5rem 0;
    }

    /* ── Status badge ──────────────────────────────────────────────────── */
    .status-row {
      display: flex;
      align-items: center;
      gap: .5rem;
      font-size: .85rem;
      color: var(--muted);
      margin-bottom: 1.4rem;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }
    .dot.running { background: var(--success); box-shadow: 0 0 6px var(--success); }
    .dot.idle    { background: var(--muted); }
  </style>
</head>
<body>

<div class="card">
  <!-- ── Login panel ──────────────────────────────────────────────── -->
  <div id="login-panel">
    <h1>Admin Login</h1>
    <p class="subtitle">Hackathon Timer — Admin</p>

    <div id="login-err" class="msg error"></div>

    <label for="email">Email</label>
    <input type="email" id="email" placeholder="admin@hack.com" autocomplete="username" />

    <label for="password">Password</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />

    <button class="btn btn-primary" id="login-btn" onclick="doLogin()">Log In</button>
  </div>

  <!-- ── Settings panel ──────────────────────────────────────────── -->
  <div id="settings-panel" style="display:none">
    <h1>Timer Settings</h1>
    <p class="subtitle">Configure and start your hackathon</p>

    <div class="status-row">
      <div class="dot idle" id="status-dot"></div>
      <span id="status-text">Loading…</span>
    </div>

    <div id="settings-err"  class="msg error"></div>
    <div id="settings-ok"   class="msg success"></div>
    <div id="settings-info" class="msg info"></div>

    <label for="hack-name">Hackathon Name</label>
    <input type="text" id="hack-name" placeholder="e.g. ACM Hackathon 2026" maxlength="80" />

    <label>Duration</label>
    <div class="row">
      <div>
        <div class="field-suffix">
          <input type="number" id="hours" min="0" max="99" value="0" />
          <span>hrs</span>
        </div>
      </div>
      <div>
        <div class="field-suffix">
          <input type="number" id="minutes" min="0" max="59" value="30" />
          <span>min</span>
        </div>
      </div>
    </div>

    <button class="btn btn-primary" id="save-btn" onclick="doSave()">Save Settings</button>
    <button class="btn btn-ghost"   id="logout-btn" onclick="doLogout()">Log Out</button>
  </div>
</div>

<script>
  // ── Helpers ──────────────────────────────────────────────────────────────
  function show(el, type, text) {
    el.className = 'msg ' + type;
    el.textContent = text;
    el.style.display = 'block';
  }
  function hide(el) { el.style.display = 'none'; }

  // ── Login ────────────────────────────────────────────────────────────────
  async function doLogin() {
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const errEl    = document.getElementById('login-err');
    const btn      = document.getElementById('login-btn');

    hide(errEl);
    btn.disabled = true;

    try {
      const res  = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const body = await res.json();
      if (res.ok) {
        showSettings();
      } else {
        show(errEl, 'error', body.error || 'Login failed.');
        btn.disabled = false;
      }
    } catch {
      show(errEl, 'error', 'Server unreachable.');
      btn.disabled = false;
    }
  }

  // Enter key triggers login
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && document.getElementById('login-panel').style.display !== 'none') {
      doLogin();
    }
  });

  // ── Show settings panel & load current state ──────────────────────────────
  async function showSettings() {
    document.getElementById('login-panel').style.display    = 'none';
    document.getElementById('settings-panel').style.display = 'block';
    await loadState();
  }

  async function loadState() {
    try {
      const res   = await fetch('/api/state');
      const state = await res.json();
      applyState(state);
    } catch {
      show(document.getElementById('settings-err'), 'error', 'Could not load state.');
    }
  }

  function applyState(state) {
    const dot      = document.getElementById('status-dot');
    const statusTx = document.getElementById('status-text');
    const saveBtn  = document.getElementById('save-btn');
    const infoEl   = document.getElementById('settings-info');

    document.getElementById('hack-name').value = state.name || '';

    if (state.durationMs) {
      const totalMin = Math.floor(state.durationMs / 60000);
      document.getElementById('hours').value   = Math.floor(totalMin / 60);
      document.getElementById('minutes').value = totalMin % 60;
    }

    if (state.started) {
      dot.className   = 'dot running';
      statusTx.textContent = 'Timer is RUNNING';
      saveBtn.disabled = true;
      document.getElementById('hours').disabled   = true;
      document.getElementById('minutes').disabled = true;
      show(infoEl, 'info', 'Timer has started. Duration can no longer be changed.');
    } else {
      dot.className   = 'dot idle';
      statusTx.textContent = 'Timer not started';
      saveBtn.disabled = false;
      document.getElementById('hours').disabled   = false;
      document.getElementById('minutes').disabled = false;
      hide(infoEl);
    }
  }

  // ── Save ─────────────────────────────────────────────────────────────────
  async function doSave() {
    const errEl  = document.getElementById('settings-err');
    const okEl   = document.getElementById('settings-ok');
    const saveBtn = document.getElementById('save-btn');

    hide(errEl); hide(okEl);
    saveBtn.disabled = true;

    const body = {
      name:    document.getElementById('hack-name').value.trim(),
      hours:   document.getElementById('hours').value,
      minutes: document.getElementById('minutes').value,
    };

    try {
      const res  = await fetch('/api/settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      if (res.ok) {
        show(okEl, 'success', 'Settings saved!');
        applyState(data.data);
      } else {
        show(errEl, 'error', data.error || 'Save failed.');
        saveBtn.disabled = false;
      }
    } catch {
      show(errEl, 'error', 'Server unreachable.');
      saveBtn.disabled = false;
    }
  }

  // ── Logout ───────────────────────────────────────────────────────────────
  async function doLogout() {
    await fetch('/api/logout', { method: 'POST' });
    document.getElementById('settings-panel').style.display = 'none';
    document.getElementById('login-panel').style.display    = 'block';
    document.getElementById('login-btn').disabled = false;
    document.getElementById('password').value = '';
  }

  // ── Auto-check session on page load ──────────────────────────────────────
  (async () => {
    try {
      const res  = await fetch('/api/auth-check');
      const data = await res.json();
      if (data.authenticated) showSettings();
    } catch { /* not logged in */ }
  })();
</script>
</body>
</html>
