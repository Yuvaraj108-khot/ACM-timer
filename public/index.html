<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HACK DAY — ACM NITTE</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@700;800&family=Bebas+Neue&display=swap');

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --purple: #7c3aed;
      --violet: #a855f7;
      --orange: #f97316;
      --pink: #ec4899;
    }

    html,
    body {
      min-height: 100vh;
      min-height: 100dvh;
      font-family: 'Inter', sans-serif;
      background: #04030e;
      overflow-x: hidden;
      color: #fff;
    }

    /* ── BG POSTER ─────────────────────────────────────────────────── */
    #bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: url('/bg.jpg') center 40% / cover no-repeat;
      filter: brightness(.72) saturate(1.2);
    }

    /* vignette — only at edges, center stays clear */
    #bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 70% at 50% 50%,
          transparent 40%,
          rgba(4, 3, 14, .72) 100%);
    }

    /* ── SHELL ─────────────────────────────────────────────────────── */
    #shell {
      position: relative;
      z-index: 2;
      height: 100vh;
      height: 100dvh;
      width: 100%;
      max-width: 100vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 1rem;
    }

    /* ── TOP BAR ───────────────────────────────────────────────────── */
    #topbar {
      display: flex;
      align-items: center;
      gap: clamp(0.5rem, 2vw, 1.1rem);
      padding: clamp(0.6rem, 2vw, 1.2rem) clamp(1rem, 4vw, 2.2rem);
      animation: fadeDown .65s ease both;
      /* glass pill */
      margin-top: clamp(0.5rem, 2.5vh, 1.2rem);
      max-width: min(92vw, 640px);
      background: rgba(255, 255, 255, .07);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, .13);
      border-radius: 9999px;
      box-shadow: 0 4px 32px rgba(0, 0, 0, .35);
    }

    /* ACM logo inside a white rounded badge */
    .logo-badge {
      background: #fff;
      border-radius: 10px;
      padding: 4px 6px;
      display: flex;
      align-items: center;
      box-shadow: 0 0 18px rgba(124, 58, 237, .55);
      flex-shrink: 0;
    }

    .logo-badge img {
      height: clamp(26px, 5vw, 38px);
      width: auto;
      display: block;
    }

    .divider {
      width: 1px;
      height: clamp(26px, 5vw, 38px);
      background: rgba(255, 255, 255, .22);
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      flex-direction: column;
      line-height: 1.15;
      min-width: 0;
    }

    .brand-main {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(1.3rem, 4.5vw, 2rem);
      letter-spacing: .12em;
      color: #fff;
      text-shadow: 0 0 20px rgba(168, 85, 247, .75);
      white-space: nowrap;
    }

    .brand-sub {
      font-size: clamp(0.55rem, 1.8vw, 0.72rem);
      font-weight: 700;
      letter-spacing: clamp(0.08em, 0.4vw, 0.2em);
      text-transform: uppercase;
      color: var(--violet);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }


    /* ── PRE-START SECTION ─────────────────────────────────────────── */
    #pre-start {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(1rem, 3vh, 1.6rem);
      padding-top: clamp(1rem, 4vh, 2rem);
      margin-bottom: auto;
      opacity: 0;
      animation: fadeUp .7s ease both .6s;
    }

    /* ── BIG CIRCULAR START BUTTON ─────────────────────────────────── */
    .launch-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: min(220px, 52vw);
      height: min(220px, 52vw);
      max-width: 220px;
      max-height: 220px;
      aspect-ratio: 1;
    }

    /* spinning gradient ring */
    .launch-wrap::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: conic-gradient(from 0deg,
          var(--purple),
          var(--violet),
          var(--pink),
          var(--orange),
          var(--purple));
      animation: spin 3s linear infinite;
      z-index: 0;
    }

    /* mask to give ring effect */
    .launch-wrap::after {
      content: '';
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      background: #0d0920;
      z-index: 1;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* pulsing glow rings */
    .ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid rgba(168, 85, 247, .5);
      animation: ripple 2.4s ease-out infinite;
    }

    .ring:nth-child(2) {
      animation-delay: .8s;
    }

    .ring:nth-child(3) {
      animation-delay: 1.6s;
    }

    @keyframes ripple {
      0% {
        transform: scale(1);
        opacity: .7;
      }

      100% {
        transform: scale(1.8);
        opacity: 0;
      }
    }

    #start-btn {
      position: relative;
      z-index: 2;
      width: min(200px, 47vw);
      height: min(200px, 47vw);
      max-width: 200px;
      max-height: 200px;
      aspect-ratio: 1;
      border-radius: 50%;
      border: none;
      background: radial-gradient(circle at 35% 35%,
          #c084fc 0%,
          #7c3aed 40%,
          #4c1d95 100%);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .3rem;
      box-shadow:
        0 0 0 0 rgba(168, 85, 247, .6),
        inset 0 1px 0 rgba(255, 255, 255, .2),
        0 20px 60px rgba(124, 58, 237, .7);
      transition: transform .2s ease, box-shadow .2s ease;
    }

    #start-btn:hover {
      transform: scale(1.07);
      box-shadow:
        0 0 0 14px rgba(168, 85, 247, .12),
        inset 0 1px 0 rgba(255, 255, 255, .2),
        0 24px 80px rgba(124, 58, 237, .9);
    }

    #start-btn:active {
      transform: scale(.96);
    }

    .btn-icon {
      font-size: clamp(1.8rem, 6vw, 2.8rem);
      line-height: 1;
      filter: drop-shadow(0 0 10px rgba(255, 255, 255, .5));
    }

    .btn-label {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(1rem, 3.6vw, 1.55rem);
      letter-spacing: .22em;
      color: #fff;
      text-shadow: 0 0 12px rgba(255, 255, 255, .4);
    }

    /* duration hint */
    .duration-hint {
      font-size: clamp(0.78rem, 2.2vw, 0.88rem);
      color: rgba(255, 255, 255, .5);
      letter-spacing: .07em;
      text-align: center;
    }

    .duration-hint .val {
      color: var(--violet);
      font-weight: 700;
    }

    .duration-hint .warn {
      color: #f87171;
    }

    /* ── COUNTDOWN ─────────────────────────────────────────────────── */
    #timer-display {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      margin-top: auto;
      margin-bottom: auto;
      padding-top: .8rem;
      width: 100%;
    }

    #countdown {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(2.4rem, 13.5vw, 14rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -.02em;
      white-space: nowrap;
      text-align: center;
      max-width: 100vw;
      background: linear-gradient(160deg,
          #fff 0%,
          #e9d5ff 40%,
          var(--violet) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 55px rgba(168, 85, 247, .5));
      animation: fadeUp .5s ease both;
    }

    /* ── TIME'S UP ─────────────────────────────────────────────────── */
    #times-up {
      display: none;
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2.5rem, 12vw, 11rem);
      letter-spacing: .1em;
      white-space: nowrap;
      text-align: center;
      max-width: 100vw;
      background: linear-gradient(135deg, #f87171, #fb923c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 55px rgba(248, 113, 113, .55));
      animation: pop 1.6s ease-in-out infinite;
    }

    /* ── BOTTOM BAR ────────────────────────────────────────────────── */
    #bottombar {
      width: 100%;
      text-align: center;
      padding: clamp(0.6rem, 2vh, 1rem) 1rem;
      font-size: clamp(0.6rem, 1.8vw, 0.72rem);
      letter-spacing: .14em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, .28);
    }

    /* ── MEDIA QUERIES ─────────────────────────────────────────────── */
    @media (max-width: 480px) {
      #topbar {
        border-radius: 16px;
      }
      .brand-sub {
        letter-spacing: .08em;
      }
    }

    @media (max-height: 520px) and (orientation: landscape) {
      #topbar {
        margin-top: .3rem;
        padding: .4rem 1rem;
      }
      #pre-start {
        padding-top: .5rem;
        gap: .6rem;
      }
      .launch-wrap {
        width: 130px;
        height: 130px;
      }
      #start-btn {
        width: 115px;
        height: 115px;
      }
      .btn-icon {
        font-size: 1.4rem;
      }
      .btn-label {
        font-size: .9rem;
      }
    }

    /* ── KEYFRAMES ─────────────────────────────────────────────────── */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(22px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeDown {
      from {
        opacity: 0;
        transform: translateY(-18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pop {

      0%,
      100% {
        transform: scale(1);
        opacity: 1;
      }

      50% {
        transform: scale(1.05);
        opacity: .8;
      }
    }
  </style>
</head>

<body>

  <!-- Full-screen background poster -->
  <div id="bg"></div>

  <div id="shell">

    <!-- Top branding bar -->
    <div id="topbar">
      <div class="logo-badge">
        <img src="/acm-logo.png" alt="ACM NITTE" />
      </div>
      <div class="divider"></div>
      <div class="brand">
        <span class="brand-main">Hack Days</span>
        <span class="brand-sub">ACM · NMIT · Powered by Gemini</span>
      </div>
    </div>

    <!-- PRE-START -->
    <div id="pre-start">
      <div class="launch-wrap">
        <!-- pulsing rings -->
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
        <!-- button -->
        <button id="start-btn">
          <span class="btn-icon">⚡</span>
          <span class="btn-label">LAUNCH</span>
        </button>
      </div>
      <p class="duration-hint" id="duration-hint"></p>
    </div>

    <div id="timer-display">
      <div id="countdown">00:00:00</div>
      <div id="times-up">TIME'S UP!</div>
    </div>

    <div id="bottombar">@ACM_NITTE &nbsp;·&nbsp; NMAM Institute of Technology</div>
  </div>

  <script>
    const preStart = document.getElementById('pre-start');
    const startBtn = document.getElementById('start-btn');
    const durationHint = document.getElementById('duration-hint');
    const timerDiv = document.getElementById('timer-display');
    const countdown = document.getElementById('countdown');
    const timesUp = document.getElementById('times-up');

    let endTime = null;
    let tickInterval = null;
    let pollInterval = null;

    const pad = n => String(n).padStart(2, '0');

    function msToHMS(ms) {
      const t = Math.max(0, Math.floor(ms / 1000));
      return pad(Math.floor(t / 3600)) + ':' + pad(Math.floor((t % 3600) / 60)) + ':' + pad(t % 60);
    }

    function fmtDuration(ms) {
      const t = Math.floor(ms / 60000);
      const h = Math.floor(t / 60), m = t % 60;
      if (h && m) return h + 'h ' + m + 'm';
      if (h) return h + ' hr' + (h > 1 ? 's' : '');
      return m + ' min';
    }

    function tick() {
      const rem = endTime - Date.now();
      if (rem <= 0) {
        countdown.style.display = 'none';
        timesUp.style.display = 'block';
        clearInterval(tickInterval);
        clearInterval(pollInterval);
      } else {
        countdown.textContent = msToHMS(rem);
      }
    }

    function applyState(state) {
      if (state.started && state.endTime) {
        endTime = state.endTime;
        preStart.style.display = 'none';
        timerDiv.style.display = 'flex';

        const rem = endTime - Date.now();
        if (rem <= 0) {
          countdown.style.display = 'none';
          timesUp.style.display = 'block';
          clearInterval(tickInterval);
          clearInterval(pollInterval);
        } else {
          countdown.style.display = 'block';
          timesUp.style.display = 'none';
          countdown.textContent = msToHMS(rem);
          if (!tickInterval) tickInterval = setInterval(tick, 1000);
        }
      } else {
        preStart.style.display = 'flex';
        timerDiv.style.display = 'none';
        if (state.durationMs) {
          durationHint.innerHTML = 'Duration: <span class="val">' + fmtDuration(state.durationMs) + '</span>';
        } else {
          durationHint.innerHTML = '<span class="warn">⚠ Admin has not set a duration yet</span>';
        }
      }
    }

    async function poll() {
      try {
        const res = await fetch('/api/state');
        const state = await res.json();
        applyState(state);
      } catch { }
    }

    startBtn.addEventListener('click', async () => {
      startBtn.disabled = true;
      startBtn.querySelector('.btn-label').textContent = '...';
      try {
        const res = await fetch('/api/start', { method: 'POST' });
        const body = await res.json();
        if (res.ok) {
          applyState(body.data);
        } else {
          alert(body.error || 'Could not start timer.');
          startBtn.disabled = false;
          startBtn.querySelector('.btn-label').textContent = 'LAUNCH';
        }
      } catch {
        alert('Server error.');
        startBtn.disabled = false;
        startBtn.querySelector('.btn-label').textContent = 'LAUNCH';
      }
    });

    poll();
    pollInterval = setInterval(poll, 5000);
  </script>
</body>

</html>
